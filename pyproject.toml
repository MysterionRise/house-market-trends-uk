[project]
name = "uk-liveability-index"
version = "0.1.0"
description = "UK Liveability Index — multi-factor scoring of neighbourhoods at LSOA level"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pydeck>=0.9",
    "streamlit>=1.35",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
