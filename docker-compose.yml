# Local deployment: `docker compose up` after building data (`make build-data`).
#   api     REST + assistant (AG-UI) + MCP          http://localhost:8000
#   static  tiles and score files for the browser   http://localhost:8080
#   web     the front end                           http://localhost:3000
# Profiles: `--profile build` for the pipeline, `--profile local-llm` for Ollama.

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    # Values come from the shell or ./.env (see .env.example); unset ones stay empty
    environment:
      LIX_MODEL: ${LIX_MODEL:-anthropic:claude-opus-5-5}
      LIX_FALLBACK_MODELS: ${LIX_FALLBACK_MODELS:-}
      LIX_EFFORT: ${LIX_EFFORT:-low}
      LIX_CORS_ORIGINS: ${LIX_CORS_ORIGINS:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - ./data/serve:/data/serve:ro
    ports: ["8000:8000"]

  static:
    image: caddy:2-alpine
    volumes:
      - ./data/serve:/srv:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["8080:8080"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DATA_URL: http://localhost:8080
    environment:
      # Server-side relay from the CopilotKit runtime to the assistant
      AGENT_URL: http://api:8000/agent
    ports: ["3000:3000"]
    depends_on: [api, static]

  pipeline:
    profiles: [build]
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    volumes:
      - ./data:/data
      - ./config:/app/config
    command: ["--help"]

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  ollama:
