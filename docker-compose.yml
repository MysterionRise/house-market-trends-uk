# Local deployment: `make up` (docker compose up --wait) after building data
# (`make build-data`, or `make data-unpack` from a data pack). LIX_SERVE_DIR picks the
# data: ./data/serve by default, ./fixtures/demo/serve for the small demo dataset.
#   api     REST + assistant (AG-UI) + MCP          http://localhost:8000
#   static  tiles and score files for the browser   http://localhost:8080
#   web     the front end                           http://localhost:3000
# Profiles: `--profile build` for the pipeline, `--profile local-llm` for Ollama.

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    # Values come from the shell or ./.env (see .env.example); unset ones stay empty
    environment:
      LIX_MODEL: ${LIX_MODEL:-anthropic:claude-opus-5-5}
      LIX_REPLAY_DELAY: ${LIX_REPLAY_DELAY:-0}
      LIX_FALLBACK_MODELS: ${LIX_FALLBACK_MODELS:-}
      LIX_EFFORT: ${LIX_EFFORT:-low}
      LIX_CORS_ORIGINS: ${LIX_CORS_ORIGINS:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-UK Liveability Index}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - ${LIX_SERVE_DIR:-./data/serve}:/data/serve:ro
      - ./data/logs:/data/logs
    ports: ["8000:8000"]

  static:
    image: caddy:2-alpine
    volumes:
      - ${LIX_SERVE_DIR:-./data/serve}:/srv:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/manifest.json"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DATA_URL: http://localhost:8080
        NEXT_PUBLIC_EXPOSE_MAP: ${LIX_EXPOSE_MAP:-0}
    environment:
      # Server-side relay from the CopilotKit runtime to the assistant
      AGENT_URL: http://api:8000/agent
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api: { condition: service_healthy }
      static: { condition: service_healthy }

  pipeline:
    profiles: [build]
    build: { context: ., dockerfile: docker/pipeline.Dockerfile }
    volumes:
      - ./data:/data
      - ./config:/app/config
    command: ["--help"]

  ollama:
    profiles: [local-llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  ollama:
