name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: uv run pytest -v

      - name: API contracts are up to date
        run: |
          uv run python -m lix_api.schemas
          git diff --exit-code contracts/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generated types match the API contracts
        run: |
          npm run types
          git diff --exit-code lib/contracts.gen.ts

      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (incl. scoring parity with Python)
        run: npm test
