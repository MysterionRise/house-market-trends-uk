name: Release smoke test

# A release as a new user gets it: the published images and the release's data pack, no
# model key, on a fresh Linux (amd64) machine. Run it on the draft once the data pack is
# uploaded: gh workflow run release-smoke.yml -f tag=v0.1.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: write # reading a draft release needs write access
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download the data pack from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --pattern "lix-serve.tar.gz*" --dir dist
          make data-unpack

      # In case the packages are still private
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the published images (no .env, so no model key)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          export LIX_VERSION="${TAG#v}"
          docker compose pull api web proxy
          make up
          docker compose images

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playwright smoke test
        working-directory: web
        env:
          LIX_SMOKE: "1"
          LIX_E2E_STACK: docker
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test smoke --reporter=line

      - if: failure()
        run: docker compose logs --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-results
          path: web/test-results/
          retention-days: 7
