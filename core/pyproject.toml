[project]
name = "lix-core"
version = "0.1.0"
description = "UK Liveability Index: shared paths, config, contracts and scoring"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lix_core"]
